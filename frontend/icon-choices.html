<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>VirtHouse icon choices</title>
  <style>
    body { margin: 0; background: #e6e6e6; color: #222; font: 16px/1.4 "Segoe UI", sans-serif; }
    h1 { margin: 24px 24px 8px; font-size: 18px; }
    p { margin: 0 24px 20px; color: #444; }
    .row { display: flex; flex-wrap: wrap; gap: 24px; padding: 0 24px 32px; }
    figure { margin: 0; width: 280px; }
    img { width: 280px; height: 280px; display: block; background: #fff; border-radius: 8px; }
    figcaption { margin-top: 8px; font-weight: 650; }
    figcaption span { display: block; font-weight: 400; color: #555; }
  </style>
</head>
<body>
  <h1>挑一個 icon</h1>
  <p>四張都是 VH。看完告訴我要 A、B、C 還是 D。</p>
  <div class="row">
    <figure>
      <img src="./icon-choices/virthouse-icon-a-shared.jpg" alt="A shared stroke">
      <figcaption>A. 共用一筆<span>V 的右腳就是 H 的左腳</span></figcaption>
    </figure>
    <figure>
      <img src="./icon-choices/virthouse-icon-b-spaced.jpg" alt="B spaced letters">
      <figcaption>B. 分開<span>兩個字母分開，底線對齊</span></figcaption>
    </figure>
    <figure>
      <img src="./icon-choices/virthouse-icon-c-house.jpg" alt="C house">
      <figcaption>C. 房子<span>橘色房子，VH 在屋身上</span></figcaption>
    </figure>
    <figure>
      <img src="./icon-choices/virthouse-icon-d-orange.jpg" alt="D orange field">
      <figcaption>D. 整面橘色<span>橘色底，深灰 VH</span></figcaption>
    </figure>
  </div>
</body>
</html>
