# Settings for the VirtHouse process itself.
# One file per host. This is not a VM spec and not a base-image inventory.
# Loaded when no other file is given. Override with VIRTHOUSE_CONFIG=/path/to/file.yaml

paths:
  # Expanded under the current user's home
  isos: ~/virthouse/isos
  bases: ~/virthouse/bases
  work: ~/virthouse/work
  overlays: ~/virthouse/overlays
  qmp: ~/virthouse/qmp

qemu:
  binary: qemu-system-x86_64

resources:
  # Host reserve buffer before allocating a new VM
  reserve_memory_mb: 2048
  reserve_cpus: 2
  # Soft caps for a single VM (0 = no soft cap)
  max_vm_memory_mb: 0
  max_vm_cpus: 0

network:
  # First subnet handed out. A VM's address and gateway are assigned at start.
  subnet_base: "192.168.100.0/24"

timeouts:
  process_start_sec: 30
  basic_ready_sec: 60
  system_ready_linux_sec: 180
  system_ready_windows_sec: 300
  overall_sec: 600
