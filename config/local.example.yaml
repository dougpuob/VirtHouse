# Copy to local.yaml and adjust for development.
#   cp config/local.example.yaml config/local.yaml
#   export VIRTHOUSE_CONFIG=$PWD/config/local.yaml

paths:
  isos: ./data/isos
  bases: ./data/bases
  work: ./data/work
  overlays: ./data/overlays
  qmp: ./data/qmp

qemu:
  binary: qemu-system-x86_64
  extra_args: []

resources:
  reserve_memory_mb: 1024
  reserve_cpus: 1
  max_vm_memory_mb: 0
  max_vm_cpus: 0

network:
  subnet_base: "192.168.100.0/24"
  guest_gateway: "192.168.100.1"
  guest_ip: "192.168.100.2"

timeouts:
  process_start_sec: 30
  basic_ready_sec: 60
  system_ready_linux_sec: 180
  system_ready_windows_sec: 300
  overall_sec: 600

server:
  host: "127.0.0.1"
  port: 8080

base_images: {}
