# Copy to local.yaml and adjust for development.
#   cp config/local.example.yaml config/local.yaml
#   export VIRTHOUSE_CONFIG=$PWD/config/local.yaml
#
# Example override of the VirtHouse process settings. Same shape as config/system.yaml.
# Base images are not listed here. Image inventory is owned by image management (DESIGN_v4.md section 3).

paths:
  isos: ~/virthouse/isos
  bases: ~/virthouse/bases
  work: ~/virthouse/work
  overlays: ~/virthouse/overlays
  qmp: ~/virthouse/qmp

qemu:
  binary: qemu-system-x86_64

resources:
  reserve_memory_mb: 1024
  reserve_cpus: 1
  max_vm_memory_mb: 0
  max_vm_cpus: 0

network:
  subnet_base: "192.168.100.0/24"

timeouts:
  process_start_sec: 30
  basic_ready_sec: 60
  system_ready_linux_sec: 180
  system_ready_windows_sec: 300
  overall_sec: 600
