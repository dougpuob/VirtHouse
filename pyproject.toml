[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virthouse"
version = "0.1.0"
description = "QEMU multi-instance management system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
virthouse = "virthouse.main:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/virthouse"]

[tool.hatch.build.targets.wheel.sources]
"backend" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
